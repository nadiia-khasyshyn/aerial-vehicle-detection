# RunPod provisioning for cloud/train_remote.py.
# Ported from the ml-pipeline cloud runner, trimmed to what this task needs:
# no S3 datasets (the tile dataset rsyncs up in one piece) and no MLflow.

api_base_url: "https://rest.runpod.io/v1"

image_name: "runpod/pytorch:1.1.0-cu1281-torch280-ubuntu2204"
cloud_type: "COMMUNITY"
gpu_count: 1
gpu_priority:
  - "NVIDIA RTX A6000"
  - "NVIDIA GeForce RTX 3090"
  - "NVIDIA GeForce RTX 4090"
  - "NVIDIA RTX A5000"
  - "NVIDIA A40"
  - "NVIDIA RTX 4000 SFF Ada Generation"
  - "NVIDIA GeForce RTX 3070"
# No CUDA-version filter: REST refused pods even for GPUs GraphQL showed in
# stock, and this list was the main suspect. A host with a pre-12.4 driver
# fails torch's CUDA init, which the launch rotation treats as "try the next
# host" anyway.
allowed_cuda_versions: []
data_center_ids: []
# No host minimums: every extra constraint silently empties the pool, and the
# workload (330 MB dataset, a sub-500k model) is happy on any host.
min_ram_per_gpu_gb: 0
min_vcpu_per_gpu: 0
min_download_mbps: 0
min_upload_mbps: 0

# Sized for the COCO pretrain peak: ultralytics keeps the zips after
# unzipping, so the volume briefly holds archives (26GB) + extracted images
# (21GB) + the venv (7GB) at once. 60GB hit the quota at 34% of the unzip.
container_disk_gb: 40
volume_gb: 120
volume_mount_path: "/workspace"
network_volume_id: null
ports:
  - "22/tcp"
support_public_ip: true

# Set after creating the GitHub repo to use --code-source git;
# the default rsync mode needs no remote at all.
repository_url: ""
workspace_path: "/workspace"
project_dir_name: "aerial-vehicle-detection"
datasets_cache_path: "/workspace/datasets"
venv_path: "/workspace/venv"
logs_path: "/workspace/logs"
requirements_file: "requirements.txt"

install_torch: true
torch_version: "2.5.1"
torchvision_version: "0.20.1"
torch_index_url: "https://download.pytorch.org/whl/cu124"

ssh_user: "root"
ssh_key_path: "~/.ssh/id_ed25519"
poll_interval_seconds: 10
provision_timeout_minutes: 25

# Only needed for --code-source git on a private repo.
forward_env:
  - "GITHUB_TOKEN"

secret_excludes:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - ".ssh/"

upload_excludes:
  - ".git/"
  - "__pycache__/"
  - "*.pyc"
  - ".DS_Store"
  - "*.mp4"
  - "*.pt"
  - "*.ts"
  - "runs/"
  - "eval_run/"
  - "dataset*/"
  - "crops*/"
  - "output*/"
  - "examples/"
